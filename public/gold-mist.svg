<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360">
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <!-- Fraktales Rauschen; stitchTiles => nahtlos kachelbar -->
    <feTurbulence type="fractalNoise" baseFrequency="0.013 0.019" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
    <!-- In Gold einfärben; Alpha aus Rausch-Helligkeit mit Schwellwert => sparsame Schwaden -->
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.831
              0 0 0 0 0.686
              0 0 0 0 0.353
              0.45 0.45 0.45 0 -0.5"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fog)"/>
</svg>
